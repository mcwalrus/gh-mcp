[project]
name = "gh-mcp"
version = "0.1.0"
description = "GitHub MCP server exposing Actions workflow tools via the gh CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastmcp>=3.2.4"]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "pyright>=1.1.400",
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pre-commit>=4.6.0",
]

# -- Ruff ---------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (likely bugs and design problems)
    "SIM",  # flake8-simplify (simplifiable code)
    "C4",   # flake8-comprehensions (better comprehensions)
    "TCH",  # flake8-type-checking (TYPE_CHECKING guard)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501", # line-too-long -- handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["gh_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# -- Pyright ------------------------------------------------------------------
[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportUnknownVariableType = true
reportUnknownMemberType = true
reportUnknownArgumentType = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

# -- Pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
